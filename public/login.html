<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <style>@media (prefers-reduced-motion: no-preference) { ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; } }</style>
    <title>SmartStudy | Giriş Yap</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --theme-color: #0dcaf0;
            --theme-gradient: linear-gradient(135deg, #0dcaf0 0%, #007bff 100%);
            --theme-shadow: rgba(13, 202, 240, 0.4);
        }
        body {
            margin: 0; min-height: 100vh; width: 100%;
            background-color: #020617; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 16px; box-sizing: border-box;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }

        .login-card {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            transition: box-shadow 0.6s ease, border-color 0.6s ease;
        }
        @media (max-width: 480px) { .login-card { padding: 28px 20px; border-radius: 22px; } }

        .role-selector { display: flex; gap: 12px; margin-bottom: 24px; }
        .role-btn {
            flex: 1; padding: 12px; text-align: center;
            background: rgba(2, 6, 23, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; cursor: pointer; color: #64748b; font-weight: 600;
            transition: all 0.3s ease; font-size: 0.85rem;
        }
        .role-btn i { margin-right: 6px; }
        .role-btn:hover { background: rgba(255, 255, 255, 0.05); color: #f8fafc; }
        .role-btn.active {
            background: rgba(2, 6, 23, 0.9); border-color: var(--theme-color); color: var(--theme-color);
            box-shadow: 0 0 20px var(--theme-shadow);
        }

        .form-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 8px; }
        .input-group-text { background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); color: #64748b; }
        .space-input { background: rgba(2, 6, 23, 0.8) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; color: #f8fafc !important; }
        .space-input::placeholder { color: #64748b; }
        .space-input:focus { border-color: var(--theme-color) !important; box-shadow: 0 0 0 0.2rem var(--theme-shadow) !important; }
        .input-group-text.eye-toggle { cursor: pointer; }
        .input-group-text.eye-toggle:hover { color: var(--theme-color); }

        .form-check-input:checked { background-color: var(--theme-color); border-color: var(--theme-color); }

        .btn-access {
            border: none; color: #000; font-weight: 800; padding: 14px; border-radius: 12px;
            width: 100%; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            cursor: pointer; background: var(--theme-gradient);
        }
        .btn-access:hover { box-shadow: 0 10px 25px var(--theme-shadow); }
        .btn-access:disabled { opacity: 0.7; cursor: default; }

        .bottom-link { color: var(--theme-color); text-decoration: none; font-weight: 600; }
        .bottom-link:hover { text-decoration: underline; }

        .back-home { color: #64748b; text-decoration: none; font-size: 0.85rem; }
        .back-home:hover { color: var(--theme-color); }

        /* MASKOT: rol seçilince örümcek (Öğrenci) iniyor / ampul (Öğretmen)
           sallanıyor - Goal Lab'daki sade tasarımdan bilerek ayrışan, bizim
           eski split-panel giriş ekranımızdan taşınan bir imza detay. */
        .mascot-zone { height: 46px; display: flex; align-items: flex-start; justify-content: center; margin-bottom: 4px; }
        .mascot-web-line { width: 2px; margin: 0 auto; background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(255,255,255,0.6)); transition: height 0.3s ease; }
        .mascot-icon-wrap { display: flex; flex-direction: column; align-items: center; }
        .mascot-icon { font-size: 1.7rem; display: block; }
        @keyframes mascotDrop {
            0% { transform: translateY(-30px) rotate(var(--mascot-rot, 0deg)); opacity: 0; }
            60% { transform: translateY(5px) rotate(var(--mascot-rot, 0deg)); opacity: 1; }
            100% { transform: translateY(0) rotate(var(--mascot-rot, 0deg)); opacity: 1; }
        }
        @keyframes mascotSwing {
            0%, 100% { transform: rotate(calc(var(--mascot-rot, 0deg) - 12deg)); }
            50% { transform: rotate(calc(var(--mascot-rot, 0deg) + 12deg)); }
        }
        .mascot-icon.mascot-drop { animation: mascotDrop 0.6s cubic-bezier(0.68, -0.55, 0.26, 1.55); }
        .mascot-icon.mascot-swing { animation: mascotSwing 1.8s ease-in-out infinite; animation-delay: 0.6s; transform-origin: top center; }
    </style>
</head>
<body>

    <!-- Tarayıcının çirkin alert() kutusu yerine şık bildirim (toast) -->
    <style>
        #toastStack { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 10px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
        .toast { background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid #0dcaf0; border-radius: 12px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); color: #f8fafc; font-family: 'Inter', Arial, sans-serif; font-size: 13px; opacity: 0; transform: translateY(-16px); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: auto; cursor: pointer; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-left-color: #22c55e; }
        .toast.error { border-left-color: #ef4444; }
        .toast.info { border-left-color: #0dcaf0; }
        .toast i { margin-top: 1px; font-size: 15px; }
        .toast.success i { color: #22c55e; }
        .toast.error i { color: #ef4444; }
        .toast.info i { color: #0dcaf0; }
        .toast .msg { flex: 1; line-height: 1.4; }
    </style>
    <div id="toastStack"></div>
    <script>
        function showToast(message, type) {
            type = type || 'info';
            const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info');
            const stack = document.getElementById('toastStack');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.innerHTML = '<i class="fas ' + icon + '"></i><span class="msg"></span>';
            el.querySelector('.msg').textContent = message;
            stack.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            function dismiss() { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }
            el.addEventListener('click', dismiss);
            setTimeout(dismiss, 4000);
        }
    </script>

    <div class="mascot-zone">
        <div class="mascot-icon-wrap">
            <div class="mascot-web-line" id="mascotLine" style="height:20px;"></div>
            <i class="fas fa-spider mascot-icon mascot-drop" id="mascotIcon" style="color:#dc3545; --mascot-rot:180deg; filter:drop-shadow(0 0 10px rgba(220,53,69,.6));"></i>
        </div>
    </div>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-halved fa-2x mb-2" style="color: var(--theme-color); filter: drop-shadow(0 0 10px var(--theme-shadow));"></i>
            <h3 class="orbitron fw-bold m-0">Hoş Geldiniz</h3>
            <p class="text-secondary small mt-1 mb-0">Hesabınıza giriş yapın</p>
        </div>

        <div class="role-selector">
            <div class="role-btn active" id="btn-role-student" onclick="switchTheme('student')"><i class="fas fa-user-astronaut"></i>Öğrenci</div>
            <div class="role-btn" id="btn-role-teacher" onclick="switchTheme('teacher')"><i class="fas fa-chess-king"></i>Öğretmen</div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">E-posta Adresi</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control space-input" placeholder="ornek@email.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="sifre" class="form-control space-input" placeholder="••••••••" required>
                    <span class="input-group-text eye-toggle" onclick="togglePassword()"><i class="fas fa-eye" id="eyeIcon"></i></span>
                </div>
            </div>
            <div class="form-check mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-secondary" for="rememberMe">Beni hatırla</label>
                </div>
                <a href="/forgot-password" class="small text-info text-decoration-none">Şifremi Unuttum</a>
            </div>
            <button type="submit" class="btn-access orbitron" id="loginBtn">Giriş Yap</button>
        </form>

        <div class="text-center mt-4 small">
            <div class="text-secondary mb-2">Hesabınız yok mu? <a href="/register" class="bottom-link">Ücretsiz kayıt olun</a></div>
            <div class="text-secondary">Girişte sorun mu var? <a href="/destek" class="bottom-link">Destek</a></div>
        </div>
    </div>

    <a href="/" class="back-home mt-4"><i class="fas fa-arrow-left me-1"></i>Ana Sayfaya Dön</a>

    <script>
        // Bu sayfa da backend ile aynı sunucudan (Render) geliyor - göreceli
        // (relative) yol kullanıyoruz, böylece hangi adresten
        // (smartstudy.com.tr veya onrender.com) girilirse girilsin hep
        // doğru çalışır ve CORS'a hiç gerek kalmaz.
        const API_BASE = '';
        let selectedRole = 'student';

        function switchTheme(role) {
            const root = document.documentElement;
            const studentBtn = document.getElementById('btn-role-student');
            const teacherBtn = document.getElementById('btn-role-teacher');
            selectedRole = role;

            if (role === 'student') {
                root.style.setProperty('--theme-color', '#0dcaf0');
                root.style.setProperty('--theme-gradient', 'linear-gradient(135deg, #0dcaf0 0%, #007bff 100%)');
                root.style.setProperty('--theme-shadow', 'rgba(13, 202, 240, 0.4)');
                studentBtn.classList.add('active');
                teacherBtn.classList.remove('active');
            } else {
                root.style.setProperty('--theme-color', '#ffc107');
                root.style.setProperty('--theme-gradient', 'linear-gradient(135deg, #ffc107 0%, #fd7e14 100%)');
                root.style.setProperty('--theme-shadow', 'rgba(255, 193, 7, 0.4)');
                teacherBtn.classList.add('active');
                studentBtn.classList.remove('active');
            }
            playMascot(role);
        }

        function playMascot(role) {
            const icon = document.getElementById('mascotIcon');
            const line = document.getElementById('mascotLine');
            // Animasyonu yeniden başlatabilmek için sınıfları kaldırıp bir
            // reflow'a zorluyoruz (yoksa aynı sınıf tekrar eklenince tarayıcı
            // "değişiklik yok" deyip animasyonu atlıyor).
            icon.classList.remove('mascot-drop', 'mascot-swing');
            void icon.offsetWidth;

            if (role === 'student') {
                icon.className = 'fas fa-spider mascot-icon';
                icon.style.color = '#dc3545';
                icon.style.setProperty('--mascot-rot', '180deg');
                icon.style.filter = 'drop-shadow(0 0 10px rgba(220,53,69,.6))';
                line.style.height = '20px';
                icon.classList.add('mascot-drop');
            } else {
                icon.className = 'fas fa-lightbulb mascot-icon';
                icon.style.color = 'var(--theme-color)';
                icon.style.setProperty('--mascot-rot', '0deg');
                icon.style.filter = 'drop-shadow(0 0 12px var(--theme-shadow))';
                line.style.height = '16px';
                icon.classList.add('mascot-drop', 'mascot-swing');
            }
        }

        function togglePassword() {
            const input = document.getElementById('sifre');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const pass = document.getElementById('sifre').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginBtn');

            if (email.trim() === "" || pass.trim() === "") {
                showToast("Hata: Kimlik doğrulama alanları boş bırakılamaz.", "error");
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i>Sistem Doğrulanıyor...';
            btn.disabled = true;

            try {
                // Firebase Hosting statik bir site; backend Render'da ayrı bir
                // domain'de çalıştığı için mutlak adrese ve cookie'nin
                // cross-site taşınabilmesi için credentials:'include'a ihtiyaç var.
                const response = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email: email, sifre: pass, requestedRole: selectedRole, rememberMe: rememberMe })
                });

                let data;
                try {
                    data = await response.json();
                } catch (err) {
                    data = { success: false, message: "Sunucu yanıtı işlenemedi." };
                }

                if (response.ok && data.success) {
                    localStorage.setItem('userRole', selectedRole);
                    // Panel her zaman Render üzerinde canlı/dinamik olarak
                    // render edildiği için oraya yönlendiriyoruz.
                    window.location.href = API_BASE + '/dashboard';
                } else if (data.emailNotConfirmed) {
                    // E-posta doğrulanmamış - kullanıcıyı direkt kod girme
                    // sayfasına gönderiyoruz, tekrar giriş denemesine gerek yok.
                    window.location.href = '/verify-email?email=' + encodeURIComponent(email);
                } else {
                    showToast(data.message || "E-Posta veya Şifre Hatalı.", "error");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Giriş hatası:", error);
                showToast("Sunucuya bağlanılamadı. Sunucu uyanıyor olabilir, birkaç saniye sonra tekrar dene.", "error");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

    </script>

</body>
</html>
