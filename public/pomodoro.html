<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <style>@media (prefers-reduced-motion: no-preference) { ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; } }</style>
    <title>SmartStudy | Pomodoro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body{ background:#020617; color:white; font-family:Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
        .panel{ max-width:420px; width:100%; background:rgba(30,41,59,.6); border:1px solid rgba(13,202,240,.25); border-radius:20px; padding:36px 28px; text-align:center; box-sizing:border-box; }
        .timer { font-family:'Orbitron', sans-serif; font-size: clamp(3rem, 15vw, 4.5rem); color:#0dcaf0; margin: 20px 0; text-shadow: 0 0 25px rgba(13,202,240,0.4); }
        .mode-badge { letter-spacing: 2px; }
    </style>
</head>
<body>
    <%- include('partials/topnav.html', { user, activeTab: 'pomodoro' }) %>
    <main class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex gap-2 legacy-page-nav">
                <a href="/" class="btn btn-sm btn-outline-secondary" title="Web Sitesine Dön"><i class="fas fa-house"></i></a>
                <a href="/dashboard" class="btn btn-sm btn-outline-info">Panele Dön</a>
            </div>
            <span class="badge bg-info text-dark mode-badge" id="modeBadge">ODAKLANMA</span>
        </div>
        <div class="d-flex gap-2 justify-content-center mb-3">
            <button class="btn btn-sm btn-info fw-bold px-3" id="workModeBtn">Odak (25 dk)</button>
            <button class="btn btn-sm btn-outline-secondary px-3" id="breakModeBtn">Mola (5 dk)</button>
        </div>
        <div class="timer" id="timerDisplay">25:00</div>
        <p class="text-secondary small mb-4">Tamamlanan Odak Seansı: <span id="sessionCount">0</span></p>
        <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-info fw-bold px-4" id="startBtn">Başlat</button>
            <button class="btn btn-outline-secondary px-4" id="resetBtn">Sıfırla</button>
        </div>
    </main>
    <audio id="alarmSound" src="/audio/alarm.mp3" preload="auto"></audio>
    <script>
        const CURRENT_USER_ID = <%- JSON.stringify(user.id) %>;
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        let remaining = WORK_TIME;
        let isWork = true;
        let isRunning = false;
        let timerId = null;
        let sessionCount = 0;

        const display = document.getElementById('timerDisplay');
        const badge = document.getElementById('modeBadge');
        const startBtn = document.getElementById('startBtn');
        const sessionEl = document.getElementById('sessionCount');
        const workModeBtn = document.getElementById('workModeBtn');
        const breakModeBtn = document.getElementById('breakModeBtn');

        function updateModeUI() {
            badge.textContent = isWork ? 'ODAKLANMA' : 'MOLA';
            badge.className = 'badge mode-badge ' + (isWork ? 'bg-info text-dark' : 'bg-warning text-dark');
            workModeBtn.className = 'btn btn-sm px-3 fw-bold ' + (isWork ? 'btn-info' : 'btn-outline-secondary');
            breakModeBtn.className = 'btn btn-sm px-3 fw-bold ' + (!isWork ? 'btn-warning' : 'btn-outline-secondary');
        }

        function switchMode(toWork) {
            clearInterval(timerId);
            isRunning = false;
            isWork = toWork;
            remaining = isWork ? WORK_TIME : BREAK_TIME;
            startBtn.textContent = 'Başlat';
            updateModeUI();
            render();
        }

        workModeBtn.addEventListener('click', () => switchMode(true));
        breakModeBtn.addEventListener('click', () => switchMode(false));

        function render() {
            const m = String(Math.floor(remaining / 60)).padStart(2, '0');
            const s = String(remaining % 60).padStart(2, '0');
            display.textContent = m + ':' + s;
        }

        // Flutter'daki AssetSource('audio/alarm.mp3') ile aynı gerçek ses
        // dosyası. 3 saniye çalıp otomatik duruyor.
        const alarmSound = document.getElementById('alarmSound');
        function beep() {
            try {
                alarmSound.currentTime = 0;
                alarmSound.play().catch(() => {});
                setTimeout(() => { alarmSound.pause(); alarmSound.currentTime = 0; }, 3000);
            } catch (e) {}
        }

        async function onWorkSessionComplete() {
            sessionCount++;
            sessionEl.textContent = sessionCount;
            try {
                await fetch('/update-pomodoro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: CURRENT_USER_ID, minutes: 25 })
                });
            } catch (e) {}
        }

        function tick() {
            remaining--;
            if (remaining <= 0) {
                beep();
                if (isWork) { onWorkSessionComplete(); }
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'Başlat';
                remaining = 0;
            }
            render();
        }

        startBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                timerId = setInterval(tick, 1000);
                startBtn.textContent = 'Duraklat';
            } else {
                clearInterval(timerId);
                startBtn.textContent = 'Başlat';
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            switchMode(true);
        });

        updateModeUI();
        render();
    </script>
    <%- include('partials/bottom-nav.html', { activeTab: 'pomodoro', user }) %>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
