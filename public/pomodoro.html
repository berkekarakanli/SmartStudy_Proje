<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <style>@media (prefers-reduced-motion: no-preference) { ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; } }</style>
    <title>SmartStudy | Pomodoro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body{ background:#020617; color:white; font-family:Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
        .panel{ max-width:420px; width:100%; background:rgba(30,41,59,.6); border:1px solid rgba(13,202,240,.25); border-radius:20px; padding:36px 28px; text-align:center; box-sizing:border-box; }
        .timer { font-family:'Orbitron', sans-serif; font-size: clamp(3rem, 15vw, 4.5rem); color:#0dcaf0; margin: 20px 0; text-shadow: 0 0 25px rgba(13,202,240,0.4); }
        .mode-badge { letter-spacing: 2px; }

        /* MOD SEÇİCİ - Pomodoro / Deneme Sayacı (Goal Lab'daki gibi bağımsız
           iki mod, aynı sayfada). Deneme Sayacı Pomodoro'dan tamamen ayrı
           çalışır. */
        .mode-tabs { display:flex; gap:6px; padding:5px; background:#0f172a; border:1px solid rgba(255,255,255,0.08); border-radius:14px; margin-bottom:20px; }
        .mode-tab { flex:1; padding:9px; border-radius:10px; border:none; background:transparent; color:#64748b; font-weight:700; font-size:12px; letter-spacing:.5px; cursor:pointer; transition:.25s; }
        .mode-tab.active { background:#0dcaf0; color:#020617; }
        .mode-tab.deneme-active { background:#10b981; color:#020617; }
        .deneme-preset { padding:8px 6px; border-radius:10px; border:1px solid rgba(16,185,129,.35); background:#0f172a; color:#6ee7b7; font-size:12px; font-weight:700; cursor:pointer; transition:.2s; }
        .deneme-preset.active { background:#10b981; color:#020617; border-color:#10b981; }
        .deneme-timer { color:#34d399; text-shadow: 0 0 25px rgba(16,185,129,0.4); }
    </style>
</head>
<body>
    <%- include('partials/topnav.html', { user, activeTab: 'pomodoro' }) %>
    <main class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex gap-2 legacy-page-nav">
                <a href="/" class="btn btn-sm btn-outline-secondary" title="Web Sitesine Dön"><i class="fas fa-house"></i></a>
                <a href="/dashboard" class="btn btn-sm btn-outline-info">Panele Dön</a>
            </div>
        </div>

        <div class="mode-tabs">
            <button type="button" class="mode-tab active" id="tabPomodoro" onclick="showMode('pomodoro')"><i class="fas fa-stopwatch me-1"></i>Pomodoro</button>
            <button type="button" class="mode-tab" id="tabDeneme" onclick="showMode('deneme')"><i class="fas fa-clipboard-list me-1"></i>Deneme Sayacı</button>
        </div>

        <!-- ================= POMODORO ================= -->
        <div id="pomodoroSection">
            <div class="d-flex justify-content-end mb-2">
                <span class="badge bg-info text-dark mode-badge" id="modeBadge">ODAKLANMA</span>
            </div>
            <div class="d-flex gap-2 justify-content-center mb-3">
                <button class="btn btn-sm btn-info fw-bold px-3" id="workModeBtn">Odak (25 dk)</button>
                <button class="btn btn-sm btn-outline-secondary px-3" id="breakModeBtn">Mola (5 dk)</button>
            </div>
            <div class="timer" id="timerDisplay">25:00</div>
            <p class="text-secondary small mb-4">Tamamlanan Odak Seansı: <span id="sessionCount">0</span></p>
            <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-info fw-bold px-4" id="startBtn">Başlat</button>
                <button class="btn btn-outline-secondary px-4" id="resetBtn">Sıfırla</button>
            </div>
        </div>

        <!-- ================= DENEME SAYACI ================= -->
        <div id="denemeSection" class="d-none">
            <p class="text-secondary small mb-3">Kendi denemeniz için geri sayım. Pomodoro ile bağımsız; süre dolunca ses açıksa uyarı çalar.</p>
            <div class="d-flex gap-2 justify-content-center flex-wrap mb-3">
                <button type="button" class="deneme-preset" data-min="40">40 dk</button>
                <button type="button" class="deneme-preset" data-min="50">50 dk</button>
                <button type="button" class="deneme-preset active" data-min="75">75 dk</button>
                <button type="button" class="deneme-preset" data-min="90">90 dk</button>
                <button type="button" class="deneme-preset" data-min="135">135 dk</button>
            </div>
            <div class="input-group input-group-sm mb-4" style="max-width:220px; margin:0 auto;">
                <input type="number" min="1" id="denemeCustomInput" class="form-control bg-dark text-white border-secondary" placeholder="Özel süre (dk)">
                <button class="btn btn-outline-light" id="denemeCustomApply">Uygula</button>
            </div>
            <div class="timer deneme-timer" id="denemeDisplay">75:00</div>
            <p class="text-secondary small mb-4" id="denemeStatus">HAZIR</p>
            <div class="d-flex gap-2 justify-content-center">
                <button class="btn fw-bold px-4" style="background:#10b981; color:#020617;" id="denemeStartBtn">Başlat</button>
                <button class="btn btn-outline-secondary px-4" id="denemeResetBtn">Sıfırla</button>
            </div>
        </div>
    </main>
    <audio id="alarmSound" src="/audio/alarm.mp3" preload="auto"></audio>
    <script>
        const CURRENT_USER_ID = <%- JSON.stringify(user.id) %>;

        function showMode(mode) {
            document.getElementById('pomodoroSection').classList.toggle('d-none', mode !== 'pomodoro');
            document.getElementById('denemeSection').classList.toggle('d-none', mode !== 'deneme');
            document.getElementById('tabPomodoro').classList.toggle('active', mode === 'pomodoro');
            document.getElementById('tabDeneme').classList.toggle('deneme-active', mode === 'deneme');
        }

        // Flutter'daki AssetSource('audio/alarm.mp3') ile aynı gerçek ses
        // dosyası. 3 saniye çalıp otomatik duruyor. Hem Pomodoro hem Deneme
        // Sayacı bu ortak fonksiyonu kullanıyor.
        const alarmSound = document.getElementById('alarmSound');
        function beep() {
            try {
                alarmSound.currentTime = 0;
                alarmSound.play().catch(() => {});
                setTimeout(() => { alarmSound.pause(); alarmSound.currentTime = 0; }, 3000);
            } catch (e) {}
        }

        // ================= POMODORO MANTIĞI =================
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        let remaining = WORK_TIME;
        let isWork = true;
        let isRunning = false;
        let timerId = null;
        let sessionCount = 0;

        const display = document.getElementById('timerDisplay');
        const badge = document.getElementById('modeBadge');
        const startBtn = document.getElementById('startBtn');
        const sessionEl = document.getElementById('sessionCount');
        const workModeBtn = document.getElementById('workModeBtn');
        const breakModeBtn = document.getElementById('breakModeBtn');

        function updateModeUI() {
            badge.textContent = isWork ? 'ODAKLANMA' : 'MOLA';
            badge.className = 'badge mode-badge ' + (isWork ? 'bg-info text-dark' : 'bg-warning text-dark');
            workModeBtn.className = 'btn btn-sm px-3 fw-bold ' + (isWork ? 'btn-info' : 'btn-outline-secondary');
            breakModeBtn.className = 'btn btn-sm px-3 fw-bold ' + (!isWork ? 'btn-warning' : 'btn-outline-secondary');
        }

        function switchMode(toWork) {
            clearInterval(timerId);
            isRunning = false;
            isWork = toWork;
            remaining = isWork ? WORK_TIME : BREAK_TIME;
            startBtn.textContent = 'Başlat';
            updateModeUI();
            render();
        }

        workModeBtn.addEventListener('click', () => switchMode(true));
        breakModeBtn.addEventListener('click', () => switchMode(false));

        function render() {
            const m = String(Math.floor(remaining / 60)).padStart(2, '0');
            const s = String(remaining % 60).padStart(2, '0');
            display.textContent = m + ':' + s;
        }

        async function onWorkSessionComplete() {
            sessionCount++;
            sessionEl.textContent = sessionCount;
            try {
                await fetch('/update-pomodoro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: CURRENT_USER_ID, minutes: 25 })
                });
            } catch (e) {}
        }

        function tick() {
            remaining--;
            if (remaining <= 0) {
                beep();
                if (isWork) { onWorkSessionComplete(); }
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'Başlat';
                remaining = 0;
            }
            render();
        }

        startBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                timerId = setInterval(tick, 1000);
                startBtn.textContent = 'Duraklat';
            } else {
                clearInterval(timerId);
                startBtn.textContent = 'Başlat';
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            switchMode(true);
        });

        updateModeUI();
        render();

        // ================= DENEME SAYACI MANTIĞI =================
        // Pomodoro'dan tamamen bağımsız: kendi süresi, kendi interval'ı.
        let denemeTotal = 75 * 60;
        let denemeRemaining = denemeTotal;
        let denemeRunning = false;
        let denemeTimerId = null;

        const denemeDisplay = document.getElementById('denemeDisplay');
        const denemeStatus = document.getElementById('denemeStatus');
        const denemeStartBtn = document.getElementById('denemeStartBtn');

        function renderDeneme() {
            const m = String(Math.floor(denemeRemaining / 60)).padStart(2, '0');
            const s = String(denemeRemaining % 60).padStart(2, '0');
            denemeDisplay.textContent = m + ':' + s;
        }

        function setDenemeDuration(minutes) {
            clearInterval(denemeTimerId);
            denemeRunning = false;
            denemeTotal = minutes * 60;
            denemeRemaining = denemeTotal;
            denemeStartBtn.textContent = 'Başlat';
            denemeStatus.textContent = 'HAZIR';
            renderDeneme();
        }

        document.querySelectorAll('.deneme-preset').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.deneme-preset').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setDenemeDuration(Number(btn.dataset.min));
            });
        });

        document.getElementById('denemeCustomApply').addEventListener('click', () => {
            const val = parseInt(document.getElementById('denemeCustomInput').value, 10);
            if (!val || val < 1) return;
            document.querySelectorAll('.deneme-preset').forEach(b => b.classList.remove('active'));
            setDenemeDuration(val);
        });

        denemeStartBtn.addEventListener('click', () => {
            denemeRunning = !denemeRunning;
            if (denemeRunning) {
                denemeStatus.textContent = 'DEVAM EDİYOR';
                denemeTimerId = setInterval(() => {
                    denemeRemaining--;
                    if (denemeRemaining <= 0) {
                        beep();
                        clearInterval(denemeTimerId);
                        denemeRunning = false;
                        denemeRemaining = 0;
                        denemeStartBtn.textContent = 'Başlat';
                        denemeStatus.textContent = 'SÜRE DOLDU';
                    }
                    renderDeneme();
                }, 1000);
                denemeStartBtn.textContent = 'Duraklat';
            } else {
                clearInterval(denemeTimerId);
                denemeStartBtn.textContent = 'Başlat';
                denemeStatus.textContent = 'DURAKLATILDI';
            }
        });

        document.getElementById('denemeResetBtn').addEventListener('click', () => {
            setDenemeDuration(Math.floor(denemeTotal / 60));
        });

        renderDeneme();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
