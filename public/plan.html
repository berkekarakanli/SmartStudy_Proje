    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #020617;
            --card-glass: rgba(30, 41, 59, 0.7);
            --accent-blue: #0dcaf0;
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body {
            background-color: var(--bg-deep);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(13, 202, 240, 0.2);
            padding: 1rem 2rem;
            margin-bottom: 50px;
        }

        .terminal-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(13, 202, 240, 0.2);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .input-group-text {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-blue);
            border-right: none;
            border-radius: 12px 0 0 12px;
        }

        .space-input {
            background: var(--input-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white !important;
            padding: 12px;
            border-radius: 0 12px 12px 0;
            transition: 0.3s;
        }

        .space-input:focus {
            background: #1e293b !important;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(13, 202, 240, 0.2);
            outline: none;
        }

        /* Kilitli/Disabled inputlar için karanlık tema uyumu */
        .space-input:disabled {
            background: rgba(15, 23, 42, 0.95) !important;
            color: #0dcaf0 !important;
            opacity: 1;
            border-color: rgba(13, 202, 240, 0.3);
            -webkit-text-fill-color: #0dcaf0;
        }

        select.space-input option {
            background: #0f172a;
            color: white;
        }

        .input-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin-bottom: 8px;
            display: block;
        }

        .btn-analyze {
            background: linear-gradient(45deg, #0dcaf0, #007bff);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 18px;
            border-radius: 15px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.4s;
            margin-top: 20px;
            font-size: 1rem;
        }

        .btn-analyze:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(13, 202, 240, 0.4);
            color: #000;
        }

        .max-info {
            font-size: 0.65rem;
            color: #64748b;
            float: right;
            margin-top: 5px;
        }

        .topic-checkbox {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(13, 202, 240, 0.2);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .topic-checkbox:hover {
            background: rgba(13, 202, 240, 0.1);
        }
        .topic-checkbox input {
            margin-right: 15px;
            accent-color: #0dcaf0;
            transform: scale(1.2);
        }

        /* Özel Karanlık Tema Kaydırma Çubuğu (Scrollbar) */
        #teacher-topics-container::-webkit-scrollbar {
            width: 8px;
        }
        #teacher-topics-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 4px;
        }
        #teacher-topics-container::-webkit-scrollbar-thumb {
            background: rgba(13, 202, 240, 0.4);
            border-radius: 4px;
        }
        #teacher-topics-container::-webkit-scrollbar-thumb:hover {
            background: rgba(13, 202, 240, 0.7);
        }
    </style>
</head>

    <nav class="navbar navbar-expand-lg">

                    <input type="hidden" name="role" value="student">

            </div>
        </div>

        <!-- ÖĞRETMEN BÖLÜMÜ -->
        <div id="teacher-section" style="display: none;">
            <div class="text-center mb-5">

                <p class="text-secondary">Sadece Sizinle Eşleşen Öğrencilerinize Spesifik Konu Ödevlendirmeleri Yapın</p>
            </div>

            <div class="terminal-card">
                <form action="https://smartstudy-proje.onrender.com/assign-homework" method="POST" onsubmit="return validateTeacherMission()">
                    <input type="hidden" name="role" value="teacher">
                    <input type="hidden" name="subject" id="hidden-subject" value="">
                    
                    <div class="row g-4 mb-4">

                                <select id="teacher-student-select" name="student_id" class="form-control space-input" required>

                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">

                                <option value="AYT">YKS - AYT</option>

                            </select>

                    'Sözcükte Anlam', 'Cümlede Anlam', 'Paragrafta Anlam ve Anlatım Teknikleri', 'Ses Bilgisi', 'Yazım Kuralları', 
                    'Noktalama İşaretleri', 'Sözcükte Yapı', 'Sözcük Türleri (İsim, Sıfat, Zamir, Zarf, Edat, Bağlaç)', 
                    'Cümlenin Öğeleri', 'Cümle Türleri', 'Anlatım Bozuklukları', 'Sözel Mantık ve Muhakeme'
                ],
                'Matematik': [
                    'Temel Kavramlar', 'Sayı Basamakları', 'Bölme ve Bölünebilme', 'EBOB - EKOK', 'Rasyonel Sayılar', 
                    'Basit Eşitsizlikler ve Mutlak Değer', 'Üslü ve Köklü Sayılar', 'Çarpanlara Ayırma', 'Oran - Orantı', 
                    'Problemler (Sayı, Kesir, Yaş, İşçi, Hareket, Yüzde-Kâr-Zarar, Karışım)', 'Kümeler', 'Fonksiyonlar ve İşlem', 
                    'Permütasyon, Kombinasyon, Olasılık', 'Tablo ve Grafik Yorumlama', 'Sayısal Mantık'
                ],
                'Tarih': [
                    'İslamiyet Öncesi Türk Tarihi', 'İlk Türk - İslam Devletleri', 'Osmanlı Devleti Siyasi Tarihi (Kuruluş, Yükselme, Duraklama, Dağılma)', 
                    'Osmanlı Devleti\'nde Kültür ve Medeniyet', '19. Yüzyıl Osmanlı Islahatları ve Olayları', 'XX. Yüzyılda Osmanlı Devleti', 
                    'Milli Mücadele Hazırlık Dönemi (Kongreler)', 'Kurtuluş Savaşı Cepheleri (İstiklal Savaşı)', 'Türk İnkılabı ve Atatürk İlkeleri', 
                    'Atatürk Dönemi İç ve Dış Politika', 'Çağdaş Türk ve Dünya Tarihi'
                ],
                'Coğrafya': [
                    'Türkiye\'nin Coğrafi Konumu (Fiziki, Beşeri, Özel)', 'Türkiye\'nin Yer Şekilleri ve Dağları', 'Türkiye\'nin Akarsuları ve Gölleri', 
                    'Türkiye\'nin İklimi ve Bitki Örtüsü', 'Türkiye\'de Toprak Tipleri ve Afetler', 'Türkiye\'nin Nüfusu ve Yerleşme Özellikleri', 
                    'Türkiye\'nin Ekonomik Coğrafyası (Tarım, Hayvancılık, Madenler, Sanayi, Ulaşım)', 'Türkiye\'nin Turizmi ve Bölgeler Coğrafyası'
                ],
                'Vatandaşlık': [
                    'Hukukun Temel Kavramları', 'Devlet Teşkilatı ve Hükûmet Sistemleri', 'Anayasa Hukukuna Giriş (1982 Anayasası)', 
                    'Yasama Organı (TBMM)', 'Yürütme Organı (Cumhurbaşkanlığı)', 'Yargı Organı (Yüksek Mahkemeler)', 
                    'İdare Hukuku', 'Temel Hak ve Hürriyetler'
                ],
                'Güncel Olaylar': [
                    'Ulusal ve Uluslararası Kuruluşlar', 'Türkiye\'nin Üye Olduğu Önemli Kuruluşlar', 
                    'Bilim, Sanat, Kültür ve Spor Alanındaki Gelişmeler', 'Güncel Bilgiler ve Siyasi Olaylar'
                ]
            }
        };

        // Firebase Hosting statik olduğu için backend'e mutlak adresle konuşuyoruz.
        const API_BASE = 'https://smartstudy-proje.onrender.com';

        document.addEventListener('DOMContentLoaded', async function() {
            const userRole = localStorage.getItem('userRole') || 'student';
            if (userRole === 'teacher') {
                document.getElementById('student-section').style.display = 'none';
                document.getElementById('teacher-section').style.display = 'block';

                try {
                    const res = await fetch(API_BASE + '/api/teacher-data', { credentials: 'include' });
                    const data = await res.json();
                    if (data.success) {
                        teacherData = data;
                        
                        const sSelect = document.getElementById('teacher-student-select');
                        if (teacherData.students.length > 0) {
                            sSelect.innerHTML = '<option value="">Eşleşen Öğrenciyi Seçin...</option>' + 
                                teacherData.students.map(s => `<option value="${s.id}">${s.ad} (${s.email})</option>`).join('');
                        } else {
                            sSelect.innerHTML = '<option value="">Eşleşen öğrenciniz bulunmuyor</option>';
                            document.getElementById('teacher-submit-btn').disabled = true;
                            document.getElementById('teacher-submit-btn').classList.add('opacity-50');
                        }

                        if (teacherData.teacher_type === 'brans') {
                            const subSelect = document.getElementById('teacher-subject');
                            subSelect.innerHTML = `<option value="${teacherData.branch}">${teacherData.branch}</option>`;
                            subSelect.value = teacherData.branch;
                            subSelect.disabled = true;
                        }
                    }
                } catch (e) {
                    console.error("Öğretmen verisi yüklenemedi", e);
                }

                updateTeacherSubjects();
            } else {
                document.getElementById('student-section').style.display = 'block';
                document.getElementById('teacher-section').style.display = 'none';
                updateExamUI();
            }
        });

        function updateExamUI() {
            const examType = document.getElementById('exam-type').value;
            const aytCatContainer = document.getElementById('ayt-category-container');
            const aytCat = document.getElementById('ayt-category').value;
            if (examType === 'AYT') aytCatContainer.style.display = 'block';
            else aytCatContainer.style.display = 'none';

            let currentData = studentExamData[examType === 'AYT' ? ('AYT_' + aytCat) : examType];
            document.getElementById('s_sinav_turu').value = examType === 'AYT' ? ('AYT_' + aytCat) : examType;
            renderStudentFields('student-dynamic-inputs', currentData);
        }

        function renderStudentFields(containerId, fields) {
            const container = document.getElementById(containerId);
            let html = '', totalMax = 0;
            fields.forEach(f => {
                totalMax += f.max;
                html += `
                <div class="col-md-6">
                    <label class="input-label">${f.label}</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas ${f.icon}"></i></span>
                        <input type="number" step="0.25" id="s_${f.id}" name="${f.id}" class="form-control space-input" placeholder="0.00" required>
                    </div>
                    <span class="max-info">Max: ${f.max} Net</span>
                </div>`;
            });
            html += `
            <div class="col-12">
                <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">
                <label class="input-label">Stratejik Net Hedefi (Toplam)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-bullseye"></i></span>
                    <input type="number" step="0.25" id="s_hedef" name="hedef" class="form-control space-input" placeholder="Örn: ${Math.floor(totalMax * 0.75)}" required>
                </div>
                <span class="max-info">Maksimum Sınır: ${totalMax} Net</span>
                <input type="hidden" id="s_max_limit" value="${totalMax}">
            </div>`;
            container.innerHTML = html;
        }

        function validateStudentMission() {
            const hedef = parseFloat(document.getElementById('s_hedef').value);
            const maxLimit = parseFloat(document.getElementById('s_max_limit').value);
            if (hedef > maxLimit) {
                alert(`Hata: Hedef net, maksimum sınır olan ${maxLimit} neti aşamaz.`);
                return false;
            }
            document.getElementById('loader-student').classList.remove("d-none");
            return true;
        }

        function updateTeacherSubjects() {
            const exam = document.getElementById('teacher-exam').value;
            const subjectSelect = document.getElementById('teacher-subject');
            
            if (teacherData.teacher_type === 'brans') {
                subjectSelect.innerHTML = `<option value="${teacherData.branch}">${teacherData.branch}</option>`;
                subjectSelect.value = teacherData.branch;
                subjectSelect.disabled = true;
            } else {
                const subjects = Object.keys(teacherSyllabus[exam] || {});
                subjectSelect.innerHTML = '';
                subjectSelect.disabled = false;
                subjects.forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub; opt.textContent = sub;
                    subjectSelect.appendChild(opt);
                });
            }
            updateTeacherTopics();
        }

        function updateTeacherTopics() {
            const exam = document.getElementById('teacher-exam').value;
            const subject = teacherData.teacher_type === 'brans' ? teacherData.branch : document.getElementById('teacher-subject').value;
            const container = document.getElementById('teacher-topics-container');
            container.innerHTML = '';
            
            if(teacherSyllabus[exam] && teacherSyllabus[exam][subject]) {
                teacherSyllabus[exam][subject].forEach((topic, i) => {
                    container.innerHTML += `
                    <label class="topic-checkbox">
                        <input type="checkbox" name="assigned_topics" value="${topic}">
                        <span style="color: #f8fafc; font-size: 0.9rem;">${i + 1}. ${topic}</span>
                    </label>`;
                });
            } else {
                container.innerHTML = `<p class="text-secondary mb-0">Bu branşa ve sınava ait konu bulunamadı.</p>`;
            }
        }

        function validateTeacherMission() {
            document.getElementById('hidden-subject').value = (teacherData.teacher_type === 'brans') ? teacherData.branch : document.getElementById('teacher-subject').value;

            if (document.querySelectorAll('input[name="assigned_topics"]:checked').length === 0) {
                alert("Lütfen en az bir konu seçiniz.");
                return false;
            }
            document.getElementById('loader-teacher').classList.remove("d-none");
            return true;
        }
    </script>
</body>
</html>
