<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="icon" type="image/svg+xml" href="/assets/logo-app-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="apple-touch-icon" href="/assets/favicon-180.png">
    <style>@media (prefers-reduced-motion: no-preference) { ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; } }</style>
    <title>SmartStudy | <%= title %></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background:#020617; color:#f8fafc; font-family:'Inter',sans-serif; min-height:100vh; padding: 40px 16px; }
        .orbitron { font-family:'Orbitron', sans-serif; }
        .panel { max-width:760px; margin:0 auto; background:rgba(30,41,59,.7); border:1px solid rgba(13,202,240,.25); border-radius:20px; padding:36px 28px; box-sizing:border-box; }
        .legal-body { font-size:.9rem; line-height:1.75; color:#cbd5e1; }
        .legal-body h6 { color:#f8fafc; margin-top:20px; font-weight:700; }
        .legal-body a { color:#0dcaf0; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h4 text-info orbitron mb-0"><i class="fas fa-scale-balanced me-2"></i><%= title %></h1>
            <a href="/" class="btn btn-sm btn-outline-info">Ana Sayfa</a>
        </div>
        <div class="legal-body"><%- bodyHtml %></div>
    </div>
</body>
</html>
